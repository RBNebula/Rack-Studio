name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      RACK_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit and integration tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Install browser and Linux dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser workflows
        run: pnpm test:e2e
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 3
